<div class="card"><h3>Ausbildung starten</h3><div class="row"><select id="tm2">${members.map(m=>`<option>${esc(m.n)}</option>`).join("")}</select><select id="tq">${QUALS.filter(q=>canTrain(meName(),q)).map(q=>`<option>${q}</option>`).join("")}</select><button class="primary" onclick="trStart()">Starten</button></div></div>

function trStart(){const m=tm2.value,q=tq.value;if(!q)return;if(!canTrain(meName(),q)){toast("Nur Instructors dürfen Prüfungen starten.");return}if(trn.some(t=>t.m===m&&t.q===q&&t.st!=="Genehmigt")){toast("Ausbildung läuft bereits.");return}trn.unshift({id:trn.reduce((x,t)=>Math.max(x,t.id),0)+1,m,q,by:meName(),d:[],st:"Läuft",t:Date.now()});save();render()}
function trTick(id){const t=trn.find(x=>x.id===id);t.d=tItems(t.q).map((_,i)=>!!document.querySelector('[onchange="trTick('+id+')"][data-i="'+i+'"]').checked);save();render()}
function trSubmit(id){trn.find(x=>x.id===id).st="Zur Prüfung";save();render();toast("Zur Prüfung beim Admin eingereicht.")}
function trDel(id){trn=trn.filter(x=>x.id!==id);save();render()}
function trNo(id){trn.find(x=>x.id===id).st="Abgelehnt";save();render()}
function trOk(id){const t=trn.find(x=>x.id===id),m=members.find(x=>x.n===t.m);if(!m){toast("Mitglied existiert nicht mehr.");return}
 const g=QG.find(x=>x.q.includes(t.q));m.q=m.q.filter(q=>!g.q.includes(q));m.q.push(t.q);t.st="Genehmigt";
 certs.unshift({id:certs.reduce((x,c)=>Math.max(x,c.id),0)+1,m:t.m,q:t.q,by:t.by,adm:meName(),date:Date.now()});

const admQ=()=>`<h2>Qualifikationen zuweisen</h2><p class="mut">Pro Bereich eine Stufe je Mitglied wählen, sie gilt sofort. Über Training → Prüfung wird sie automatisch mit Zertifikat vergeben.</p><div class="card tbl"><table><tr><th>Mitglied</th>${QG.map(g=>`<th style="color:${g.c}">${g.g}</th>`).join("")}</tr>${members.map((m,i)=>`<tr><td><b>${esc(m.n)}</b><div class="mut">${m.rang}</div></td>${QG.map(g=>{const c=g.q.find(q=>m.q.includes(q))||"";return `<td><select style="min-width:150px" onchange="setQ(${i},'${g.g}',this.value)"><option value="">–</option>${[...g.q].reverse().map(q=>`<option ${q===c?"selected":""}>${q}</option>`).join("")}</select></td>`}).join("")}</tr>`).join("")}</table></div>`;
let cap={a:0,b:0,s:1};function newCap(){cap={a:2+Math.floor(Math.random()*9),b:2+Math.floor(Math.random()*8),s:1+Math.floor(Math.random()*9999)}}newCap();
function drawCap(){const c=document.getElementById("capc");if(!c)return;const x=c.getContext("2d");let s=cap.s;const R=()=>(s=s*16807%2147483647)/2147483647;x.fillStyle="#061225";x.fillRect(0,0,160,48);for(let i=0;i<7;i++){x.strokeStyle="rgba(92,200,255,"+(.2+R()*.5)+")";x.beginPath();x.moveTo(R()*160,R()*48);x.lineTo(R()*160,R()*48);x.stroke()}x.font="bold 26px monospace";x.fillStyle="#e8f0ff";[...(cap.a+" + "+cap.b+" = ?")].forEach((ch,i)=>{x.save();x.translate(10+i*16,32+R()*6-3);x.rotate(R()*.5-.25);x.fillText(ch,0,0);x.restore()})}
let bgImg=store.get("gc_bg",""),bgOp=store.get("gc_bgop",.55);
function applyBg(){const e=document.getElementById("bg");e.style.backgroundImage=bgImg?"url("+bgImg+")":"none";e.style.opacity=bgOp}
function setBg(f){if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);bgImg=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u);store.set("gc_bg",bgImg);applyBg();syncPush();render()};im.src=u}
function clearBg(){bgImg="";store.set("gc_bg","");applyBg();syncPush();render()}

/* ===== Externes Backend: Supabase (gleiche Schnittstelle wie die claude.ai-DB) ===== */
function sbAdapter(c){
 const L={};let ch=null;
 const err=e=>Object.assign(new Error(e.message||"db"),{code:(e.code==="42501"||e.status===401||e.status===403)?"not_granted":e.code});
 const fetchC=async n=>{const{data,error}=await c.from("gc_docs").select("id,data").eq("coll",n);if(error)throw err(error);return data||[]};
 let pend=0,lastW=0;
 const fire=n=>(L[n]||[]).forEach(async l=>{try{const t0=Date.now(),r=await fetchC(n);if(pend>0||t0<=lastW){setTimeout(()=>fire(n),450);return}l.cb({docs:r.map(x=>({data:()=>x.data}))})}catch(e){l.er&&l.er(e)}});
 const watch=(n,cb,er)=>{(L[n]=L[n]||[]).push({cb,er});fire(n);
  if(!ch){ch=c.channel("gc").on("postgres_changes",{event:"*",schema:"public",table:"gc_docs"},p=>{const r=p.new&&p.new.coll?p.new:p.old;if(r&&r.coll)fire(r.coll)}).subscribe();
   setInterval(()=>Object.keys(L).forEach(fire),60000)}};
 const put=async(n,id,o)=>{pend++;try{const{error}=await c.from("gc_docs").upsert({coll:n,id,data:o,updated_at:new Date().toISOString()});if(error)throw err(error)}finally{pend--;lastW=Date.now()}};
 return{
  collection:n=>({doc:id=>({set:o=>put(n,id,o),delete:async()=>{pend++;try{const{error}=await c.from("gc_docs").delete().eq("coll",n).eq("id",id);if(error)throw err(error)}finally{pend--;lastW=Date.now()}}}),onSnapshot:(cb,er)=>watch(n,cb,er)}),
  doc:p=>{const[n,id]=p.split("/");return{set:o=>put(n,id,o),onSnapshot:(cb,er)=>watch(n,s=>cb({exists:s.docs.length>0}),er)}}}}
async function syncStart(){try{
 if(SB_URL&&SB_KEY&&window.supabase){DBH=sbAdapter(window.supabase.createClient(SB_URL,SB_KEY));setBadge();DBH.doc("gc_meta/init").onSnapshot(sn=>{syncReady=true;syncInit=sn.exists;if(syncInit)subAll();else syncPush()},()=>{});render();return}
 if(!window.claude||!claude.use)return;const d=await claude.use("db");if(!d)return;DBH=d;
 try{const u=await claude.use("user");if(u){const w=await u.can("data.write");if(w===false)syncRO=true}}catch(e){}
 setBadge();DBH.doc("gc_meta/init").onSnapshot(sn=>{syncReady=true;syncInit=sn.exists;if(syncInit)subAll();else syncPush()},()=>{});render()}catch(e){}}

const SAVE_FILE="galaxycrew-save.json";
const getSave=()=>({news,members,tickets,disp,events,fleet,lfg,pw,rooms,trn,certs,clock,gimgs,bgImg,bgOp,legal});
async function saveGame(){
 if(!window.JSZip){toast("ZIP-Bibliothek nicht geladen – bitte Seite neu laden.");return}
 const now=new Date(),z=new JSZip();
 z.file(SAVE_FILE,JSON.stringify({app:"galaxycrew",v:1,saved:now.toISOString(),data:getSave()}));
 z.file("README.txt","Galaxy CREW Save-Game vom "+now.toLocaleString("de-DE")+"\nWiederherstellen: Admin-Dashboard > Übersicht > Save laden und diese ZIP-Datei wählen.\nDie Datei "+SAVE_FILE+" nicht verändern.\n");
 const blob=await z.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
 const fn="GalaxyCREW-Save-"+now.toISOString().slice(0,16).replace(/[:T]/g,"-")+".zip";
 try{const d=window.claude&&claude.use?await claude.use("downloads"):null;
  if(d){await d.save({filename:fn,data:blob});toast("Save-Datei erstellt.");return}}

  const z=await JSZip.loadAsync(f),e=z.file(SAVE_FILE);if(!e)throw 0;
  const s=JSON.parse(await e.async("string"));if(s.app!=="galaxycrew"||!s.data)throw 0;

  const cur=sess&&members.find(x=>x.n===sess.n),curPw=sess&&pw[sess.n],d=s.data,A=x=>Array.isArray(x)?x:[],O=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};

  pw=O(d.pw);rooms=O(d.rooms);trn=A(d.trn);certs=A(d.certs);gimgs=O(d.gimgs);bgImg=d.bgImg||"";bgOp=d.bgOp||.55;
  clock={act:O(d.clock&&d.clock.act),log:A(d.clock&&d.clock.log)};legal={imp:(d.legal&&d.legal.imp)||"",dat:(d.legal&&d.legal.dat)||""};
  if(cur&&!members.some(m=>m.adm&&pw[m.n])){members=members.filter(m=>m.n!==cur.n);members.unshift({...cur,adm:true});pw[cur.n]=curPw}
  store.set("gc_gimgs",gimgs);store.set("gc_bg",bgImg);store.set("gc_bgop",bgOp);store.set("gc_legal",legal);
  save();applyBg();render();
  if(window.syncPush)syncPush(true);

const alarmCustom=()=>(cfg.find(x=>x.id===2)||{}).snd||"";
const alarmFile=()=>alarmCustom()||ALARM_VOICE;
function playSrc(src,vol){return new Promise(r=>{try{const a=new Audio(src);a.volume=Math.max(0,Math.min(1,vol));a.onended=r;a.onerror=r;a.play().catch(r)}catch(e){r()}})}
async function dispVoice(d){const vol=pv("vv",1);sndBusy=true;try{const ms=beepDispatch();if(ms)await new Promise(r=>setTimeout(r,ms+250));if(pv("tts",true))await playSrc(alarmFile(),vol);else if(!ms&&pv("snd",true)!==false)await playSrc(ALERT_SND,vol*.8)}finally{sndBusy=false}}
async function dispRepeat(){if(sndBusy)return;sndBusy=true;try{const ms=beepDispatch();if(ms)await new Promise(r=>setTimeout(r,ms+250));if(pv("tts",true))await playSrc(alarmFile(),pv("vv",1))}finally{sndBusy=false}}
function alarmUp(f){if(role!=="admin"||!f)return;if(!/^audio\//.test(f.type)||f.size>4e5){toast("Nur Audiodateien (MP3, WAV, OGG, M4A) bis 400 KB.");return}const r=new FileReader();r.onload=()=>{cfg=cfg.filter(x=>x.id!==2).concat([{id:2,snd:r.result}]);aud("alarm_voice","set");toast("✅ Alarm-Sprachdatei gespeichert.");render()};r.readAsDataURL(f)}
function alarmDel(){if(role!=="admin")return;cfg=cfg.filter(x=>x.id!==2);aud("alarm_voice","del");render()}
const alarmCard=()=>`<h2>Alarm-Stimme</h2><div class="card"><p class="mut">Bei jedem Dispatch-Alarm wird für alle eine Sprachdatei abgespielt. Standardmäßig ist die mitgelieferte Datei aktiv. Du kannst sie durch eine eigene ersetzen (MP3, WAV, OGG oder M4A, max. 400 KB, am besten 2 bis 4 Sekunden).</p><p>Status: ${alarmCustom()?"✅ eigene Datei aktiv":"✅ Standard-Datei aktiv"}</p><div class="row"><input type="file" accept="audio/*" onchange="alarmUp(this.files[0])"><button onclick="dispVoice({id:7})">▶ Testen</button>${alarmCustom()?'<button onclick="alarmDel()">↩ Standard wiederherstellen</button>':""}</div></div>`;
const voiceSet=()=>`<div style="margin:4px 0 12px 52px"><label style="display:block">Lautstärke<br><input type="range" min=".2" max="1" step=".05" value="${pv("vv",1)}" onchange="P.vv=parseFloat(this.value);store.set('gc_pref',P)"></label><p class="row"><button onclick="dispVoice({id:7})">▶ Alarm testen</button><button onclick="beepCall()">▶ Notruf-Piepton</button><button onclick="beepDispatch()">▶ Dispatch-Piepton</button></p></div>`
setInterval(()=>{if(document.getElementById("alarm")&&!prevA)dispRepeat()},15000);
function actWatch(){if(rank[role]<1)return;
 const L={ev:events.map(e=>e.id),nw:news.map(n=>n.k),lf:lfg.map(l=>l.id),di:disp.map(d=>d.id),ch:chat.map(c=>c.id),fo:forum.map(f=>f.id)};
 if(SB_URL&&!(hyd.events&&hyd.news&&hyd.lfg&&hyd.disp&&hyd.chat&&hyd.forum))return;
 if(!actInit){actInit=true;for(const k in L)seenA[k]=new Set(L[k]);return}
 const nw=k=>L[k].filter(x=>!seenA[k].has(x));
 nw("ev").forEach(i=>pv("nev",true)&&notify("📅 Neues Event: "+(events.find(e=>e.id===i)||{}).title));
 nw("nw").forEach(i=>pv("nnw",true)&&notify("📰 Neue News: "+(news.find(n=>n.k===i)||{}).t));
 nw("lf").forEach(i=>pv("nlf",true)&&notify("👥 Neue Gruppensuche: "+(lfg.find(l=>l.id===i)||{}).title));
 nw("di").forEach(i=>{if((role==="dispatcher"||role==="admin")&&pv("ndi",true)){const d=disp.find(x=>x.id===i)||{};if(document.hidden)notify("🚨 NEUER NOTRUF: "+d.cat+" – "+d.loc,true);else incomingFx(d);beepCall();}});
 nw("fo").forEach(i=>pv("nfo",true)&&notify("📌 Neuer Forum-Eintrag: "+(forum.find(f=>f.id===i)||{}).title));
 nw("ch").forEach(i=>{const c=chat.find(x=>x.id===i);if(c&&c.n!==me&&chatVis(c)&&!chatOpen&&pv("nch",true))notify("💬 "+c.n+": "+c.t)});
 for(const k in L)seenA[k]=new Set(L[k])}
function chatToggle(){chatOpen=!chatOpen;let p=document.getElementById("chatp");
 if(!p){p=document.createElement("div");p.id="chatp";p.innerHTML='<div style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>💬 Crew-Chat</b></div><div id="chatl"></div><div style="padding:6px 8px;border-top:1px solid var(--line)"><select id="chatto" style="width:100%"></select></div><div id="chatf"><input id="chati" maxlength="300" placeholder="Nachricht …" onkeydown="if(event.key===\'Enter\')chatSend()"><button class="primary" onclick="chatSend()">➤</button></div>';document.body.appendChild(p)}
 p.classList.toggle("open",chatOpen);if(chatOpen){chatSeen=Date.now();store.set("gc_chatseen",chatSeen);chatRender();trApply();setTimeout(()=>document.getElementById("chati").focus(),50)}chatBadge()}
function chatTo(){const t=document.getElementById("chatto");if(!t)return;const v=t.value,o=[""].concat(members.filter(m=>m.n!==me&&!m.pend).map(m=>m.n));t.innerHTML=o.map(n=>`<option value="${esc(n)}">${n?"An: "+esc(n):"An: Alle"}</option>`).join("");t.value=o.includes(v)?v:""}
const chatVis=c=>!c.to||c.to===me||c.n===me;
function chatRender(){const l=document.getElementById("chatl");if(!l||!chatOpen)return;chatTo();const b=l.scrollTop+l.clientHeight>=l.scrollHeight-30;
 l.innerHTML=chat.filter(chatVis).map(c=>`<p><b style="color:${c.n===me?"var(--ac2)":"var(--tx)"}">${esc(c.n)}${csTxt(members.find(x=>x.n===c.n))?" "+csTxt(members.find(x=>x.n===c.n)):""}${c.to?` → ${esc(c.to)} 🔒`:""}</b> <span class="mut">${fmt(c.ts)}</span><br>${esc(c.t)}</p>`).join("")||'<p class="mut">Noch keine Nachrichten.</p>';if(b)l.scrollTop=l.scrollHeight}

const k=300/s.z,px=s.x*k+w/2,py=s.y*k+h/2,r=Math.max(.3,(1-s.z/w)*2.2);
x.fillStyle="rgba(210,230,255,"+(1-s.z/w)+")";x.beginPath();x.arc(px,py,r,0,7);x.fill()}
requestAnimationFrame(f)}f()})();

/* ===== Piepton-Alarme (Web Audio) ===== */
var AC=null,sndBusy=false;
function acx(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>acx(),{passive:true}));
function beepSeq(seq){if(pv("snd",true)===false)return 0;const a=acx();if(!a)return 0;let end=0;
 try{const g=a.createGain();g.gain.value=.28*Math.max(.2,Math.min(1,pv("vv",1)));g.connect(a.destination);
  seq.forEach(([f,s,d])=>{const o=a.createOscillator(),e=a.createGain();o.type="square";o.frequency.value=f;o.connect(e);e.connect(g);const t=a.currentTime+s;
   e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(1,t+.015);e.gain.setValueAtTime(1,t+d-.03);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);end=Math.max(end,s+d)})}catch(e){return 0}
 return Math.round(end*1000)}
setInterval(()=>{if(document.getElementById("alarm")&&!prevA&&!sndBusy)beepRepeat()},6000);

/* ===== Kompaktes Ausklapp-Menü (Handy/Tablet) ===== */
var mOpen=false,mGrp="";
function mToggle(){mOpen=!mOpen;if(!mOpen)mGrp="";window._mk=null;mnavBuild()}
function mTog(g){mGrp=mGrp===g?"":g;window._mk=null;mnavBuild()}
function mClose(){mOpen=false;mGrp="";window._mk=null;mnavBuild()}
function mGo(t){mOpen=false;mGrp="";window._mk=null;go(t)}
function mnavBuild(G){if(G)window._G=G;G=window._G;const el=document.getElementById("mnav");if(!el||!G)return;
 const L={de:["Menü","Updates","Einstellungen"],en:["Menu","Updates","Settings"],he:["תפריט","עדכונים","הגדרות"]}[lang]||["Menü","Updates","Einstellungen"];
 const who={visitor:"Besucher",crew:"Crew",dispatcher:"Disponent",admin:"Admin"}[role],lg=document.getElementById("login"),lt=lg?lg.textContent:"";
 const h=G.map(g=>g[1]?`<div class="mg ${mGrp===g[0]?"open":""} ${g[0]==="Notruf"?"sos":""}"><button class="mgh ${g[1].includes(tab)?"on":""}" onclick="event.stopPropagation();mTog('${g[0]}')"><span>${g[0]}</span><i>▾</i></button><div class="mgb">${g[1].map(i=>`<button class="${i===tab?"cur":""}" onclick="mGo('${i}')">${i}</button>`).join("")}</div></div>`:`<div class="mg"><button class="mgh ${g[0]===tab?"on":""}" onclick="mGo('${g[0]}')"><span>${g[0]}</span></button></div>`).join("");
 const mb=document.getElementById("menub");if(mb){mb.classList.toggle("open",!!mOpen);const ml=document.getElementById("menul");if(ml)ml.textContent=L[0]}
 el.classList.toggle("open",!!mOpen);
 const k=h+lang+role+tab+mGrp+lt;if(k===window._mk)return;window._mk=k;
 el.innerHTML=`<div class="mlist">${h}</div><div class="mtools"><span class="tag mwho">${who}</span><button onclick="mGo('Updates')">📋 ${L[1]}</button><button onclick="mGo('Einstellungen')">⚙ ${L[2]}</button><button onclick="mClose();setLangTo('de')">🇩🇪</button><button onclick="mClose();setLangTo('en')">🇬🇧</button><button onclick="mClose();setLangTo('he')">🇮🇱</button><button class="primary" onclick="mClose();document.getElementById('login').click()">${lt}</button></div>`;
 if(window.trApply)trApply()}
document.addEventListener("click",e=>{if(mOpen&&!e.target.closest("#mnav")&&!e.target.closest("#menub"))mClose()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&mOpen)mClose()});

/* ===== v2.4: Sci-Fi-Alarmton ===== */
function fxBus(){const a=acx();if(!a||pv("snd",true)===false)return null;const vol=.55*Math.max(.2,Math.min(1,pv("vv",1)));
 const m=a.createGain();m.gain.value=vol;const c=a.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=6;m.connect(c);c.connect(a.destination);
 const d=a.createDelay(1),fb=a.createGain(),w=a.createGain();d.delayTime.value=.17;fb.gain.value=.38;w.gain.value=.28;m.connect(d);d.connect(fb);fb.connect(d);d.connect(w);w.connect(c);return{a,m}}
function sweepTone(B,t,f0,f1,dur,type,g){type=type||"sawtooth";g=g||.5;const{a,m}=B,e=a.createGain(),f=a.createBiquadFilter();f.type="lowpass";f.Q.value=7;
 f.frequency.setValueAtTime(f0*2.2,t);f.frequency.exponentialRampToValueAtTime(f1*3.4,t+dur);
 e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+.02);e.gain.setValueAtTime(g,t+Math.max(.03,dur-.05));e.gain.exponentialRampToValueAtTime(.0001,t+dur);f.connect(e);e.connect(m);
 [-9,9].forEach(dt=>{const o=a.createOscillator();o.type=type;o.detune.value=dt;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);o.connect(f);o.start(t);o.stop(t+dur+.05)})}
function thump(B,t,g){const{a,m}=B,o=a.createOscillator(),e=a.createGain();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(38,t+.28);
 e.gain.setValueAtTime(g||.9,t);e.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(e);e.connect(m);o.start(t);o.stop(t+.35)}
function ping(B,t,f,dur,g){const{a,m}=B,o=a.createOscillator(),e=a.createGain();o.type="triangle";o.frequency.value=f;
 e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g||.35,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+(dur||.22));o.connect(e);e.connect(m);o.start(t);o.stop(t+(dur||.22)+.02)}
function beepDispatch(){const B=fxBus();if(!B)return 0;const t=B.a.currentTime+.02;thump(B,t);[0,.5,1].forEach(s=>sweepTone(B,t+.05+s,520,1250,.42));ping(B,t+1.58,1568,.18);ping(B,t+1.74,2093,.5,.4);return 2300}
function beepCall(){const B=fxBus();if(!B)return 0;const t=B.a.currentTime+.02;[0,.14,.28].forEach((s,i)=>sweepTone(B,t+s,700*(1+i*.18),1400*(1+i*.18),.12,"square",.28));ping(B,t+.5,1976,.4,.38);return 1000}
function beepRepeat(){const B=fxBus();if(!B)return 0;const t=B.a.currentTime+.02;sweepTone(B,t,520,1250,.42);ping(B,t+.5,1568,.3,.3);return 900}

/* ===== v2.4: Ankunfts-Animation + erweitertes Dispatch-Dashboard ===== */
var dFilter="aktiv";
const PRIO={"Medizinische Hilfe":3,"Unter Beschuss / Piraten":3,"Gestrandet / Antrieb ausgefallen":2,"Schiffsschaden / Reparatur":2,"Tank leer":2,"Bergung (Salvage)":1,"Sonstiges":1};
const PRL={3:["HOCH","#ff3b55"],2:["MITTEL","#ffb347"],1:["NORMAL","#5cc8ff"]},STL=["Eingang","Bearbeitung","Alarmiert","Vor Ort","Fertig"];
const prio=d=>PRIO[d.cat]||1;
const mmss=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),z=n=>String(n).padStart(2,"0");return(h?h+":":"")+z(m)+":"+z(ms%60)};
const newCls=d=>Date.now()-d.t<12000?" newd":"";
function incomingFx(d,label){if(!d||document.querySelector('.inc[data-id="'+d.id+'"]'))return;const o=document.createElement("div");o.className="inc";o.dataset.id=d.id;
 o.innerHTML=`<div class="rad">🚨</div><b class="h">${label||"Eingehender Notruf"} · #${d.id}</b><div style="font-size:1.25rem;font-weight:700">${esc(d.cat)}</div><div style="opacity:.85">📍 ${esc(d.loc)} · ${esc(d.from)}</div><div class="bar"></div>`;
 o.onclick=()=>{o.remove();if(role==="dispatcher"||role==="admin")go("Disponenten-Dashboard")};document.body.appendChild(o);trApply();
 setTimeout(()=>{o.classList.add("bye");setTimeout(()=>o.remove(),420)},8000)}

function unitState(d,n){if(!clock.act[n])return["off","nicht im Dienst"];if(d.status==="Einheiten alarmiert"||d.status==="Einheit vor Ort")return(d.ack||[]).includes(n)?["ok","bestätigt"]:["warn","wartet auf Bestätigung"];return["","zugewiesen"]}
function dispCard(d){const p=prio(d),pc=PRL[p][1],i=DSTAT.indexOf(d.status),cm=members.find(x=>x.n===d.from);
 return `<div class="card dcard${newCls(d)}" style="--pc:${pc}"><div class="dhead"><b>#${d.id} ${esc(d.cat)}</b><span class="tag ${stc(d.status)}">${d.status}</span><span class="tag" style="color:${pc};border-color:${pc}">${PRL[p][0]}</span><span class="dtimer" data-since="${d.t}" data-end="${d.clT||""}">⏱ ${mmss((d.clT||Date.now())-d.t)}</span></div>
 <div class="stp">${DSTAT.map((x,j)=>`<span class="${j<i?"done":j===i?"cur":""}"><i></i>${STL[j]}</span>`).join("")}</div>
 <div class="mut">📍 ${esc(d.loc)} · ${fmt(d.t)}</div>
 <div style="margin:6px 0"><b>Melder:</b> ${esc(d.from)} <span class="mut">${cm?cm.rang:""}</span> ${clock.act[d.from]?'<span class="dot"></span>':""}${cm?qtags(cm):""}</div>
 <p>${esc(d.desc)||'<span class="mut">Keine Beschreibung</span>'}</p>
 ${d.alT?`<div class="mut">Reaktionszeit bis Alarm: ${mmss(d.alT-d.t)}${d.onT?" · bis vor Ort: "+mmss(d.onT-d.t):""}</div>`:""}
 <div class="mut" style="margin-top:8px">Zugewiesene Einheiten (${d.units.length}):</div><div class="ros">${d.units.map(u=>{const[c,tx]=unitState(d,u);return `<span class="tag ${c}">${esc(u)} · ${tx}</span>`}).join("")||'<span class="mut">keine</span>'}</div>
 <div class="row"><select onchange="dStat(${d.id},this.value)">${DSTAT.map(x=>`<option ${x===d.status?"selected":""}>${x}</option>`).join("")}</select><button class="primary" onclick="dAlarm(${d.id})">Ausgewählte losschicken (${d.units.length})</button><button onclick="prevA=${d.id};render()">Alarm-Vorschau</button><button onclick="dDel(${d.id})">Löschen</button></div>
 <p class="mut" style="margin:10px 0 4px">Wen losschicken? Grüner Punkt = im Dienst</p><div class="row">${[...members].sort((a,b)=>!!clock.act[b.n]-!!clock.act[a.n]).map(m=>`<button class="chip ${d.units.includes(m.n)?"on":""}" style="${clock.act[m.n]?"":"opacity:.55"}" onclick="dUnit(${d.id},'${esc(m.n)}')">${clock.act[m.n]?'<span class="dot"></span>':""}${esc(m.n)} · ${m.rang}${(d.ack||[]).includes(m.n)?" ✓":""}</button>`).join("")}</div><div class="row" style="margin-top:6px"><button onclick="dAllDuty(${d.id})">Alle im Dienst wählen</button></div>
 ${chatHtml(d,"Leitstelle")}</div>`}
views["Disponenten-Dashboard"]=()=>{if(role!=="dispatcher"&&role!=="admin")return lock("Disponenten");
 const cnt=s=>disp.filter(d=>d.status===s).length,act=disp.filter(d=>d.status!=="Abgeschlossen"),busy={};act.forEach(d=>d.units.forEach(u=>busy[u]=d.id));
 const on=members.filter(m=>clock.act[m.n]),free=on.filter(m=>!busy[m.n]),rt=disp.filter(d=>d.alT).map(d=>d.alT-d.t),avg=rt.length?mmss(rt.reduce((a,b)=>a+b,0)/rt.length):"–";
 const K=[["Neu",cnt("Eingegangen"),"#ff5d73"],["In Bearbeitung",cnt("In Bearbeitung")],["Alarmiert",cnt("Einheiten alarmiert"),"#ffb347"],["Vor Ort",cnt("Einheit vor Ort"),"var(--ok)"],["Abgeschlossen",cnt("Abgeschlossen")],["Ø Reaktionszeit",avg],["Einheiten frei",free.length+"/"+on.length,"var(--ok)"]];
 const F=[["aktiv","Aktiv",act.length],["Eingegangen","Neu",cnt("Eingegangen")],["Einheiten alarmiert","Alarmiert",cnt("Einheiten alarmiert")],["Einheit vor Ort","Vor Ort",cnt("Einheit vor Ort")],["Abgeschlossen","Abgeschlossen",cnt("Abgeschlossen")],["alle","Alle",disp.length]];
 const list=disp.filter(d=>dFilter==="alle"||(dFilter==="aktiv"?d.status!=="Abgeschlossen":d.status===dFilter)).sort((a,b)=>(a.status==="Abgeschlossen")-(b.status==="Abgeschlossen")||prio(b)-prio(a)||b.t-a.t);

 ${list.map(dispCard).join("")||'<p class="mut">Keine Einsätze in dieser Ansicht.</p>'}`};
